name: Release

on:
  push:
    tags:
      # This repository tags releases WITHOUT a "v" prefix (12.0.2, 13.0.6,
      # 14.0.0). A "v*" pattern alone therefore never fires, which is why the
      # 14.0.0 release produced no GitHub release and no TER publish. Match both
      # spellings; the called workflow strips an optional leading "v".
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: 'nr-image-sitemap'
      package-name: 'netresearch/nr-image-sitemap'
      extension-key: 'nr_image_sitemap'
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
