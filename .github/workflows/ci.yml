name: CI
on:
  push:
  pull_request:
permissions: {}
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2", "8.5"]'
      typo3-versions: '["^13.0"]'
      typo3-packages: '["typo3/cms-core", "typo3/cms-seo"]'
      run-rector: false  # rector 0.17.0 in .build/ is incompatible with PHP 8.2+
      run-unit-tests: false
      run-functional-tests: false
